# ENGINEERING lanes and the RELEASE GATE are different questions, and this file keeps them apart.
#
# The original release gate **failed**: three of ADR-001's twelve predeclared kill conditions do not
# hold and a fourth passes vacuously, and the project is closed as a pre-registered negative result.
# That must not make the software build permanently red — a red build is one nobody reads, and a
# regression would then hide behind the disclosed failure. It must equally not be laundered into a
# pass by an `xfail` or a deletion, which is the one thing ADR-001 forbids.
#
# So the `engineering` lanes run everything except the kill test and must be GREEN: lint, types,
# unit tests, a real pgvector integration, the bitemporal behaviour, citation validation, artifact
# reproduction, the planted breaches and the image. The `release-gate` lane runs the kill test
# through `scripts/release_gate.py`, prints `ORIGINAL RELEASE GATE: FAILED`, and goes red only when
# reality diverges from the pinned record in `DISCLOSED_FAILURES` — in either direction. A condition
# that starts failing is a regression; a disclosed failure that starts passing needs a human to
# decide whether the fix was legitimate or the hold-out was tuned against.
#
# Two lanes that matter and three that support them.
#
# `fast` is what a pull request waits on: lint, types, and every test that needs no database and no
# embedding model. It finishes in about a minute, which is the difference between a check people
# read and one they learn to ignore.
#
# `evidence` is the one that decides whether the project's claims are still true. It starts a real
# PostgreSQL **with the pgvector extension**, regenerates the corpus, rebuilds every artifact and
# grades them with the kill test that was committed before any implementation existed. Kill
# condition K is specifically a claim that the extension participates, so running this against a
# plain postgres image would make the whole lane a lie.
#
# None of these is `continue-on-error`. A lane allowed to fail silently is a lane that is already
# failing.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so the falsifiability lane runs even in a quiet week.
    - cron: "23 6 * * 2"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # A value only CI uses. Not a secret, not shared with anything, and not a credential for anything
  # that exists outside this job's network namespace.
  PAG_DATABASE_URL: postgresql+psycopg://parts:ci_only_not_a_secret@localhost:5432/parts_answer_gate
  PAG_EMBEDDING_CACHE: .fastembed_cache

jobs:
  fast:
    name: engineering — lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Format check
        run: uv run ruff format --check src tests scripts

      - name: Types
        run: uv run mypy src

      - name: Tests that need no infrastructure
        # The store and retrieval tests skip without a database; the gate, the citations, the
        # metrics and the domain invariants are real coverage and run here.
        run: uv run pytest tests -q --ignore=tests/test_kill_criteria.py

  evidence:
    name: engineering — pgvector, corpus, evaluation, artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        # pgvector/pgvector, not postgres. Kill condition K asserts the extension participates in
        # retrieval, and a plain image would make that assertion unrunnable — which is worse than
        # failing it, because the lane would go green.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: parts
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: parts_answer_gate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U parts -d parts_answer_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      qdrant:
        # The second backend `storage_comparison.json` measures against. Local, like the one in
        # docker-compose.yml, and the artifact says so in its own body: nothing in this repository
        # has ever reached Qdrant Cloud.
        image: qdrant/qdrant:v1.19.0
        ports: ["6333:6333"]
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Cache the embedding model
        # ~220MB of ONNX. Downloading it on every run would dominate the lane and would make CI
        # depend on a model host being up, which is not a dependency this project needs.
        uses: actions/cache@v4
        with:
          path: .fastembed_cache
          key: fastembed-paraphrase-multilingual-MiniLM-L12-v2-v1

      - name: Migrate
        run: uv run alembic upgrade head

      - name: Generate the corpus
        # Rebuilt from a committed seed rather than kept in git. A corpus in history is a corpus
        # nobody regenerates, and then the seed stops being the source of truth.
        run: uv run python scripts/generate_corpus.py

      - name: Prove the corpus is reproducible
        run: uv run python scripts/generate_corpus.py --verify-determinism

      - name: Embed the corpus into pgvector
        # This step was missing, and its absence meant the lane below ran the whole evaluation
        # against an empty table: recall over no candidates, a plan over no rows, and a kill test
        # graded on numbers that described nothing. `make evidence` had the step; CI did not.
        run: uv run python scripts/seed_index.py

      - name: Build the evidence
        # Produces pgvector.json, index_lifecycle.json and storage_comparison.json as part of the
        # ordinary build. For the whole of the first iteration those three existed only as helper
        # functions with no caller, and the numbers that were quoted for them came from scripts run
        # by hand. Evidence only a person can regenerate is not evidence.
        run: uv run python scripts/build_artifacts.py

      - name: The predeclaration guard
        # `test_kill_criteria.py` has not been edited since it was committed with zero source files,
        # and `test_predeclaration.py` fails the build if anything in it learns to skip or if a
        # threshold moved. That check belongs here, in the green lane: it is a property of the
        # repository, not of the result.
        run: uv run pytest tests/test_predeclaration.py -q

      - name: Engineering suite against a real database
        # Everything except the kill test, which the release-gate lane reports separately. This is
        # the lane that says whether the software works.
        run: uv run pytest tests -q --ignore=tests/test_kill_criteria.py

      - name: The README quotes what the artifacts measured
        run: uv run python scripts/readme_numbers.py --check

      - name: The committed evidence is current
        run: uv run python scripts/check_artifacts_current.py

      - name: Publish the artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: artifacts/
          retention-days: 30

  release-gate:
    name: ORIGINAL RELEASE GATE (reported, not laundered)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: parts
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: parts_answer_gate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U parts -d parts_answer_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports: ["6333:6333"]
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: .fastembed_cache
          key: fastembed-paraphrase-multilingual-MiniLM-L12-v2-v1
      - name: Rebuild the evidence
        run: |
          uv run alembic upgrade head
          uv run python scripts/generate_corpus.py
          uv run python scripts/seed_index.py
          uv run python scripts/candidate_profile.py
          uv run python scripts/build_artifacts.py
      - name: Report the release gate
        # Exits 0 while the outcome matches the pinned record, which currently reads FAILED on E, F
        # and H. It exits non-zero on any divergence, so this lane is a regression detector rather
        # than a rubber stamp — and it never converts a failed condition into a pass.
        run: uv run python scripts/release_gate.py
      - name: Publish the gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate
          path: artifacts/release_gate.json
          retention-days: 90

  falsifiability:
    name: engineering — planted breaches
    # Only where it is worth the minutes; never advisory.
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: parts
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: parts_answer_gate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U parts -d parts_answer_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      qdrant:
        # The second backend `storage_comparison.json` measures against. Local, like the one in
        # docker-compose.yml, and the artifact says so in its own body: nothing in this repository
        # has ever reached Qdrant Cloud.
        image: qdrant/qdrant:v1.19.0
        ports: ["6333:6333"]
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: .fastembed_cache
          key: fastembed-paraphrase-multilingual-MiniLM-L12-v2-v1

      - name: Migrate and build the evidence
        run: |
          uv run alembic upgrade head
          uv run python scripts/generate_corpus.py
          uv run python scripts/seed_index.py
          uv run python scripts/build_artifacts.py

      - name: Plant every breach and check each is caught
        run: uv run python scripts/plant_breaches.py

      - name: Grade the breach report
        run: uv run pytest tests/test_falsifiability.py -q

      - name: No planted breach survived
        # Scoped to the paths a breach can be planted in. The step above rebuilds artifacts, whose
        # provenance records the commit and the runner, so an unscoped diff would fail on build
        # output and say nothing about whether a breach survived — and a check that goes red for the
        # wrong reason gets muted, taking the right reason with it.
        run: git diff --exit-code -- src tests scripts alembic

  docker:
    name: engineering — image builds, migrates and serves
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: parts
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: parts_answer_gate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U parts -d parts_answer_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t parts-answer-gate:ci .

      - name: It serves without any infrastructure at all
        # Proves the image does not need a database to start. `PAG_SKIP_SEED` is what makes this
        # fast: without it the entrypoint would spend its whole connect timeout waiting for a
        # database this step deliberately does not provide.
        run: |
          docker run -d --name pag-bare -p 8001:8000 \
            -e PAG_ENVIRONMENT=ci -e PAG_SKIP_SEED=true parts-answer-gate:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8001/healthz || true)
            if [ "$code" = "503" ]; then echo "degraded, as expected with no database"; exit 0; fi
            if [ "$code" = "200" ]; then echo "unexpectedly healthy with no database"; exit 1; fi
            sleep 2
          done
          echo "the container never answered"; docker logs pag-bare; exit 1

      - name: It migrates, indexes and serves against a real pgvector database
        # The path a deployment actually takes, from an empty database, with the `postgres://`
        # scheme a hosting provider emits rather than the one the code prefers.
        run: |
          docker run -d --name pag -p 8000:8000 --network host \
            -e PORT=8000 -e PAG_ENVIRONMENT=ci \
            -e PAG_DATABASE_URL='postgres://parts:ci_only_not_a_secret@localhost:5432/parts_answer_gate' \
            parts-answer-gate:ci
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/healthz || true)
            if [ "$code" = "200" ]; then echo healthy; break; fi
            sleep 2
          done
          docker logs pag
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/healthz)" = "200"

      - name: Every screen renders and a question gets an answer or an abstention
        run: |
          for path in / /evidence /failures /provenance; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8000$path")
            echo "$path -> $code"
            test "$code" = "200"
          done
