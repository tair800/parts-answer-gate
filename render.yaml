# A public, read-only demonstration on Render's free tier.
#
# Four things about this file are deliberate.
#
# **`PAG_READ_ONLY` is true, and there is nothing for it to protect.** This service has no route
# that ingests, re-indexes or edits anything: the flag is a label on the header rather than a gate
# in front of a write. It is set anyway so that the deployed configuration says out loud what the
# code already guarantees, and so a future route cannot be added without someone noticing the flag.
#
# **No model API key reaches this service.** The shipped answerer is extractive — it returns spans
# from the passages it cites and structurally cannot emit a part number that its evidence does not
# contain — and the abstractive arm raises rather than returning a stub. There is nothing here that
# could spend money on behalf of a visitor, which is the only safe shape for a public endpoint in
# front of anything metered.
#
# **The corpus and its vectors are baked into the image, not built at start.** Encoding 12,420
# passages takes minutes on a builder and would take hours on a shared-CPU instance — long past any
# health check. The Docker build regenerates the corpus from its committed seed and precomputes the
# vectors; the container loads them into PostgreSQL without opening the encoder at all. The query
# encoder still loads on first request, which is the one cold-start cost that cannot be moved.
#
# **The corpus is synthetic and every page says so.** No real manufacturer's documentation is
# published here, and the provenance screen states the seed, the generator version and the hold-out
# freeze digest.
#
# **The database is a free Neon PostgreSQL 16 in Frankfurt, not a Render one.** Render allows one
# free PostgreSQL per workspace and another project in this portfolio holds it; taking that would
# mean modifying a frozen project. Neon's free tier ships pgvector, which is what kill condition K
# is about, so the deployed console runs real retrieval against a real vector index rather than
# serving committed artifacts alone.
#
# Deploy with the Render Blueprint flow. Nothing here needs a payment method.

services:
  - type: web
    name: parts-answer-gate
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    # `/livez` rather than `/healthz`, and the difference matters. `/healthz` answers 503 without a
    # database — the truthful answer, and it stays that way — but a platform health check wired to
    # it would refuse to route traffic to a console whose evidence screens work perfectly without
    # one. The platform is asked whether the process is alive; `/healthz` still reports the index.
    healthCheckPath: /livez
    autoDeploy: true
    envVars:
      - key: PAG_READ_ONLY
        value: "true"
      - key: PAG_ENVIRONMENT
        value: public-demo
      # The instance has 512MB and the multilingual encoder needs about 671MB resident, so query
      # vectors are served from the same build-time cache the index was loaded from. Retrieval is
      # unchanged -- the same hybrid search over the same pgvector index, the same gate, the same
      # citations -- because a vector computed at build time is bit-identical to one computed now.
      # The cost is that free text outside the corpus has no vector, and the page says so rather
      # than answering from a partial signal.
      - key: PAG_QUERY_CACHE_ONLY
        value: "true"
      # The database. `sync: false` means the blueprint declares that this variable exists and
      # leaves its value to the dashboard, which is the only correct place for a credential: a DSN
      # written here would be committed, and every deployment of this blueprint would carry it.
      #
      # It points at a **free Neon PostgreSQL 16 in Frankfurt**, not at a Render database, because
      # Render allows one free PostgreSQL per workspace and another project in this portfolio holds
      # it. Neon ships pgvector, which is what kill condition K is about, and the connection is the
      # **direct** endpoint rather than the pooled one: `store.engine` applies session settings on
      # connect — `hnsw.ef_search` among them — and a transaction-mode pooler discards those, so the
      # deployed service would search at a different beam width from the one every published figure
      # was measured at.
      - key: PAG_DATABASE_URL
        sync: false
      # Deliberately absent: PAG_LLM_API_KEY. Nothing in this build has ever called a model API,
      # and an image that shipped a key would put the same credential on every deployment of this
      # blueprint.
      #
      # Deliberately absent: PAG_QDRANT_URL. The second backend exists for one evidence artifact,
      # measured locally and committed; the deployed service never reads it, and pointing this at a
      # public Qdrant would be paying for a comparison that has already been made.

# No `databases:` block, because the database is not Render's. See `PAG_DATABASE_URL` above: it is
# a free Neon PostgreSQL 16 in the same region, provisioned because the one free Render PostgreSQL
# this workspace is entitled to belongs to another project. `make db` gives the same thing locally
# from `docker-compose.yml`, on the same major version, with the same extension.
